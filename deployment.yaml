apiVersion: apps/v1

kind: Deployment

metadata:
  name: mymavenapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mymavenapp

  template:
    metadata:
      labels:
        app: mymavenapp

    spec:
      containers:
      - name: mymavenapp

        image: adithyark14/mymavenapp:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 8080
